version: '3.8'

services:
  web:
    build: .
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      # Ignore host node_modules to avoid OS mismatch conflicts
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=127.0.0.1
    stdin_open: true
    tty: true
